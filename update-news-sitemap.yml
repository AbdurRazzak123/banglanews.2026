name: Update Google News Sitemap

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate news sitemap
        run: python3 tools/generate_news_sitemap.py

      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-sitemap.xml
          git diff --cached --quiet || git commit -m "Update Google News sitemap"
          git push
